[env:pocket-dongle-s3]

custom_meshtastic_hw_model = 0
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 0
custom_meshtastic_display_name = Pocket Dongle S3
custom_meshtastic_tags = DIY

extends = esp32s3_base

board = esp32-s3-devkitc1-n16r8

board_level = extra

# Don't know if this is needed
board_build.partitions = default_16MB.csv

build_flags = 
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/pocket_dongle_s3

lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.27

# This carrier has no addressable LEDs.
lib_ignore =
  ${esp32_common.lib_ignore}
  Adafruit NeoPixel

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}